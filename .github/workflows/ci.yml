name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / sanitize=${{ matrix.sanitize }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 Linux: AVX2 micro-kernel
          - { os: ubuntu-latest, compiler: g++, sanitize: OFF }
          - { os: ubuntu-latest, compiler: g++, sanitize: ON }
          - { os: ubuntu-latest, compiler: clang++, sanitize: OFF }
          - { os: ubuntu-latest, compiler: clang++, sanitize: ON }
          # Apple Silicon macOS: NEON micro-kernel
          - { os: macos-latest, compiler: clang++, sanitize: OFF }
          - { os: macos-latest, compiler: clang++, sanitize: ON }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DGEMM_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j

      - name: Test (default threads)
        run: ctest --test-dir build --output-on-failure

      # odd thread count -> uneven split
      - name: Test (3 threads)
        run: GEMM_THREADS=3 ctest --test-dir build --output-on-failure

      # timings on CI mean nothing, just checks bench runs and passes the error check
      - name: Benchmark smoke test
        if: matrix.sanitize == 'OFF'
        run: ./build/bench --skip-naive
